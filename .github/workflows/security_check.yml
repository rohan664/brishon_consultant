name: PR security checks
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
  pull-requests: read
  
jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-code
        uses: actions/checkout@v4
      
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
